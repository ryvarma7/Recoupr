[project]
name = "recoupr"
version = "0.1.0"
description = "AI revenue-recovery agent system for Razorpay merchants (test mode only)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]  # autogenerated by alembic

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "DTZ", "UP"]
ignore = [
    # FastAPI's dependency-injection idiom IS a call in an argument default.
    "B008",
    # The whole pipeline runs on naive UTC by design (see app/core/clock.py);
    # tz-aware values are normalized once at every entry point.
    "DTZ005", "DTZ001",
    # str+Enum keeps .value serialization stable across SQLModel/pydantic;
    # StrEnum adds nothing here and churns every entity file.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Star-import is deliberate: registers every table on SQLModel.metadata.
"app/db/migrations/env.py" = ["F403"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:on_event.*",
]
