[alembic]
script_location = app/db/migrations
prepend_sys_path = .
# URL is overridden from RECOUPR_DATABASE_URL / DATABASE_URL in env.py —
# this placeholder only exists so alembic boots without env vars set.
sqlalchemy.url = sqlite:///./recoupr.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
