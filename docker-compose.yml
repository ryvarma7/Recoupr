services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recoupr
      POSTGRES_PASSWORD: recoupr
      POSTGRES_DB: recoupr
    ports:
      # Host 5432 is held by a locally-installed Postgres; expose on 5433 instead.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoupr"]
      interval: 3s
      timeout: 3s
      retries: 15

  backend:
    build: .
    # Migrations run before serve — Postgres deployments don't get create_all.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      # +psycopg driver suffix: requirements pin psycopg 3, not psycopg2.
      DATABASE_URL: postgresql+psycopg://recoupr:recoupr@db:5432/recoupr
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      SMS_SENDER_VERIFIED: ${SMS_SENDER_VERIFIED:-false}
      WHATSAPP_SENDER_VERIFIED: ${WHATSAPP_SENDER_VERIFIED:-false}
      MERCHANT_TIMEZONE: ${MERCHANT_TIMEZONE:-Asia/Kolkata}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    image: node:22-alpine
    working_dir: /srv
    # npm ci never rewrites package-lock.json (npm install churned it every boot).
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    volumes:
      - ./dashboard:/srv
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      # Host 3000 is claimed by stale Docker/WSL proxies on this machine; use 3100.
      - "3100:3000"
    depends_on:
      - backend

volumes:
  pgdata:
